<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

       <meta charset="UTF-8">

       <title>Borrow Form</title>

       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
       <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
       <link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>


       <div class="container mt-5">


              <h2>Borrow Book</h2>

              <div th:if="${error}" class="alert alert-danger">
                     <span th:text="${error}"></span>
              </div>

              <form th:action="@{/borrows/save}" th:object="${borrow}" method="post">
                     <input type="hidden" name="returnTo" th:value="${returnTo}">
                     <input type="hidden" th:field="*{id}">

                     <div class="mb-3">

                            <label class="form-label">User</label>

                            <div class="d-flex gap-2">

                                   <select id="userSelect" class="form-select flex-grow-1" th:field="*{userId}"
                                          th:disabled="${editMode}">

                                          <option value="">
                                                 Select User
                                          </option>

                                          <option th:each="user : ${users}" th:value="${user.id}"
                                                 th:text="${user.fullname}">
                                          </option>

                                   </select>

                                   <a th:if="${!editMode}" class="btn btn-outline-primary"
                                          th:href="@{/users/create(returnTo='/borrows/create')}">

                                          +

                                   </a>

                            </div>

                            <input type="hidden" th:if="${editMode}" th:field="*{userId}">

                     </div>



                     <div class="mb-3">

                            <label class="form-label">Book</label>
                            <div class="d-flex gap-2">
                                   <select id="bookSelect" class="form-select flex-grow-1" th:field="*{bookId}"
                                          th:disabled="${editMode}">


                                          <option value="">
                                                 Select Book
                                          </option>


                                          <option th:each="book:${books}" th:value="${book.id}" th:text="${book.title}">
                                          </option>


                                   </select>
                                   <a th:if="${!editMode}" class="btn btn-outline-primary"
                                          th:href="@{/books/create(returnTo='/borrows/create')}">

                                          +

                                   </a>
                            </div>
                            <input type="hidden" th:if="${editMode}" th:field="*{bookId}">

                     </div>



                     <div class="mb-3">

                            <label>Borrow Date</label>


                            <input type="date" class="form-control" name="borrowDate" th:value="${borrow.borrowDate}">
                     </div>



                     <div class="mb-3">

                            <label>Due Date</label>

                            <input type="date" class="form-control" name="dueDate" th:value="${borrow.dueDate}">


                     </div>

                     <div class="mb-3">

                            <label>Return Date</label>

                            <input type="date" class="form-control" name="returnDate" th:value="${borrow.returnDate}"
                                   th:disabled="${!returned}">


                     </div>

                     <button type="submit" class="btn btn-success">

                            Save

                     </button>
                     <a th:href="@{${returnTo}}" class="btn btn-secondary">
                            Back
                     </a>
              </form>
       </div>
       <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
       <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
       <script th:src="@{/js/select-search.js}"></script>
</body>

</html>
