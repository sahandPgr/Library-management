<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<th:block th:fragment="entityModal">


    <div class="modal fade" id="entityModal" tabindex="-1">


        <div class="modal-dialog modal-dialog-centered">


            <div class="modal-content">


                <div class="modal-header">


                    <h5 class="modal-title" id="entityModalTitle">

                        Add Entity

                    </h5>


                    <button type="button" class="btn-close" data-bs-dismiss="modal">

                    </button>


                </div>



                <div class="modal-body">


                    <input type="hidden" id="entityType">


                    <div id="entityFields">

                    </div>



                </div>




                <div class="modal-footer">


                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button type="button" class="btn btn-primary" id="saveEntityBtn">

                        Save

                    </button>


                </div>



            </div>


        </div>


    </div>


</th:block>


</html>
