<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="alerts">

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show auto-dismiss"
         role="alert">

        <span th:text="${success}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"></button>

    </div>

    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show auto-dismiss"
         role="alert">

        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"></button>

    </div>

    <div th:if="${warning}"
         class="alert alert-warning alert-dismissible fade show auto-dismiss"
         role="alert">

        <span th:text="${warning}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"></button>

    </div>

    <div th:if="${info}"
         class="alert alert-info alert-dismissible fade show auto-dismiss"
         role="alert">

        <span th:text="${info}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"></button>

    </div>

</div>

</html>
