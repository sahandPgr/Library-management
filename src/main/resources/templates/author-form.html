<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Author Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

        <h2>Author Form</h2>

        <form th:action="@{/authors/save}" th:object="${author}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label>Full Name</label>
                <input type="text" class="form-control" th:field="*{fullName}" required>
            </div>

            <div class="mb-3">
                <label>Nationality</label>
                <input type="text" class="form-control" th:field="*{nationality}" required>
            </div>

            <div class="mb-3">
                <label>Birth Date</label>
                <input type="date" class="form-control" th:field="*{birthDate}">
            </div>

            <button class="btn btn-success" type="submit">Save</button>

            <a th:href="${returnTo != null && !returnTo.isBlank() ? returnTo : '/authors'}" class="btn btn-secondary">Back</a>

        </form>

    </div>
    <script th:src="@{/js/app.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
