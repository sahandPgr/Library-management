<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>User Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>User Form</h2>

        <form th:action="${userDto.id == null}
      ? @{/users/create}
      : @{/users/update}" th:object="${userDto}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">

                <label class="form-label">Full Name</label>

                <input type="text" class="form-control" th:field="*{fullname}">

            </div>

            <div class="mb-3">

                <label class="form-label">Email</label>

                <input type="email" class="form-control" th:field="*{email}">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input type="password" class="form-control" th:field="*{password}">


                <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                </div>


                <small class="text-muted">
                    Leave empty during edit to keep current password
                </small>

            </div>

            <div class="mb-3">

                <label class="form-label">Role</label>

                <select class="form-select" th:field="*{role}">

                    <option th:each="role : ${roles}" th:value="${role}" th:text="${role}">
                    </option>

                </select>

            </div>

            <button class="btn btn-success">

                Save

            </button>

            <a th:href="@{${returnTo}}" class="btn btn-secondary">

                Back

            </a>

        </form>

    </div>
</body>

</html>
