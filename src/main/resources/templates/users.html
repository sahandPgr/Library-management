<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Users</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <h2>Users</h2>

    <div class="mb-3">
 <a href="/"
           class="btn btn-secondary">
            Home
        </a>
        <a href="/users/create"
           class="btn btn-primary">
            Add User
        </a>


       

    </div>

    <table class="table table-bordered table-hover">

        <thead>

        <tr>

            <th>ID</th>

            <th>Full Name</th>

            <th>Email</th>

            <th>Role</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="user : ${users}">

            <td th:text="${user.id}"></td>

            <td th:text="${user.fullname}"></td>

            <td th:text="${user.email}"></td>

            <td th:text="${user.role}"></td>

            <td>

                <a th:href="@{/users/edit/{id}(id=${user.id})}"
                   class="btn btn-warning btn-sm">

                    Edit

                </a>

                <a href="#" th:data-url="@{/users/delete/{id}(id=${user.id})}"
                   class="btn btn-danger btn-sm delete-btn" data-bs-toggle="modal"
                   data-bs-target="#deleteModal">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
    <th:block th:replace="~{fragments/delete-modal :: script}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>

</html>
