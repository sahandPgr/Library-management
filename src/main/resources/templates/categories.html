<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Categories</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-5">
<div th:replace="~{fragments/alerts :: alerts}"></div>
        <h2>Categories</h2>
        <a href="/" class="btn btn-secondary mb-3">Home</a>
        <a href="/categories/create" class="btn btn-primary mb-3">
            Add Category
        </a>
        <table class="table table-bordered">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                </tr>

            </thead>

            <tbody>

                <tr th:each="category : ${categories}">

                    <td th:text="${category.id}"></td>

                    <td th:text="${category.name}"></td>
                    <td>
                        <a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn btn-warning btn-sm">
                            Edit
                        </a>
                        <a href="#" th:data-url="@{/categories/delete/{id}(id=${category.id})}"
                            class="btn btn-danger btn-sm delete-btn" data-bs-toggle="modal"
                            data-bs-target="#deleteModal">
                            Delete
                        </a>
                    </td>

                </tr>

            </tbody>

        </table>

    </div>
        <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
    <th:block th:replace="~{fragments/delete-modal :: script}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>

</html>
