<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Authors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <h2>Authors</h2>

        <a href="/" class="btn btn-secondary mb-3">Home</a>

        <a th:href="@{/authors/create(returnTo='/authors')}" class="btn btn-primary mb-3">
            Add Author
        </a>

        <table class="table table-bordered">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Nationality</th>
                    <th>Birth Date</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="author : ${authors}">

                    <td th:text="${author.id}"></td>

                    <td th:text="${author.fullName}"></td>

                    <td th:text="${author.nationality}"></td>

                    <td th:text="${author.birthDate}"></td>

                    <td>

                        <a th:href="@{/authors/edit/{id}(id=${author.id},returnTo='/authors')}" class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a href="#" th:data-url="@{/authors/delete/{id}(id=${author.id})}"
                            class="btn btn-danger btn-sm delete-btn" data-bs-toggle="modal"
                            data-bs-target="#deleteModal" data-item="Author">
                            Delete
                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
    <th:block th:replace="~{fragments/delete-modal :: script}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>

</html>
