<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Books</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">
     <div th:replace="~{fragments/alerts :: alerts}"></div>
    <h2>Books</h2>

    <a href="/" class="btn btn-secondary mb-3">Home</a>

    <a href="/books/create" class="btn btn-primary mb-3">
        Add Book
    </a>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>ID</th>
            <th>Title</th>
            <th>ISBN</th>
            <th>Year</th>
            <th>Author</th>
            <th>Publisher</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Available</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="book : ${books}">

            <td th:text="${book.id}"></td>

            <td th:text="${book.title}"></td>

            <td th:text="${book.isbn}"></td>

            <td th:text="${book.publishYear}"></td>

            <td th:text="${book.author.fullName}"></td>

            <td th:text="${book.publisher.name}"></td>

            <td th:text="${book.category.name}"></td>

            <td th:text="${book.quantity}"></td>

            <td th:text="${book.availableQuantity}"></td>

            <td>

                <a class="btn btn-warning btn-sm"
                   th:href="@{/books/edit/{id}(id=${book.id})}">
                    Edit
                </a>

                <a 
                  href="#" th:data-url="@{/books/delete/{id}(id=${book.id})}"
                    class="btn btn-danger btn-sm delete-btn" data-bs-toggle="modal"
                    data-bs-target="#deleteModal">
                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
    <th:block th:replace="~{fragments/delete-modal :: script}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>

</html>
