<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Publishers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <h2>Publishers</h2>

        <a th:href="@{/}" class="btn btn-secondary mb-3">Home</a>

        <a th:href="@{/publishers/create(returnTo='/publishers')}" class="btn btn-primary mb-3">
            Add Publisher
        </a>

        <table class="table table-bordered">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="publisher : ${publishers}">

                    <td th:text="${publisher.id}"></td>
                    <td th:text="${publisher.name}"></td>
                    <td th:text="${publisher.address}"></td>
                    <td th:text="${publisher.phone}"></td>

                    <td>

                        <a th:href="@{/publishers/edit/{id}(id=${publisher.id})}" class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a href="#" th:data-url="@{/publishers/delete/{id}(id=${publisher.id})}"
                            class="btn btn-danger btn-sm delete-btn" data-bs-toggle="modal"
                            data-bs-target="#deleteModal" data-item="Publisher">
                            Delete
                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
    <th:block th:replace="~{fragments/delete-modal :: script}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>

</html>
